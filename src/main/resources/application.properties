# Nombre y puerto de la aplicación
spring.application.name=pupusapp
server.port=8080

# Base de datos H2 en memoria (se borra al reiniciar)
spring.datasource.url=jdbc:h2:mem:pupusapp
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Consola web de H2: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:pupusapp)
spring.h2.console.enabled=true

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
